name: Deploy to Heroku

on:
    push:
        branches:
            - develop # Trigger on push to develop branch

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"

            - name: Install Heroku CLI
              run: |
                  curl https://cli-assets.heroku.com/install.sh | sh

            - name: Authenticate with Heroku and Deploy
              env:
                  HEROKU_API_KEY: ${{secrets.HEROKU_API_KEY}}
              run: |
                  # Configure git credential helper BEFORE any git operations
                  git config --global credential.helper store
                  mkdir -p ~/.git
                  echo "https://1bis.solutions.tech@gmail.com:$HEROKU_API_KEY@git.heroku.com" > ~/.git-credentials
                  chmod 600 ~/.git-credentials

                  # Add Heroku remote manually (avoid heroku git:remote which triggers git auth)
                  git remote add heroku https://git.heroku.com/reservation-api-dev.git || git remote set-url heroku https://git.heroku.com/reservation-api-dev.git

                  # Push to Heroku main branch (same command we used manually)
                  git push heroku HEAD:main --force
