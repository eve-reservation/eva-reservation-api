name: Deploy to Heroku

on:
  push:
    branches:
      - develop # Trigger on push to develop branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Authenticate with Heroku and Deploy
        env:
          HEROKU_API_KEY: ${{secrets.HEROKU_API_KEY}}
        run: |
          # Authenticate with Heroku CLI using API key
          echo "$HEROKU_API_KEY" | heroku login --api-key -
          
          # Add Heroku remote using CLI (sets up proper authentication)
          heroku git:remote -a reservation-api-dev
          
          # Push to Heroku main branch (same command we used manually)
          git push heroku HEAD:main --force
