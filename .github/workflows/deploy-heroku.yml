name: Deploy to Heroku

on:
    push:
        branches:
            - develop # Trigger on push to develop branch

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"

            - name: Install Heroku CLI
              run: |
                  curl https://cli-assets.heroku.com/install.sh | sh

            - name: Authenticate with Heroku
              env:
                  HEROKU_API_KEY: ${{secrets.HEROKU_API_KEY}}
              run: |
                  # Authenticate using API key (same as heroku login)
                  echo "$HEROKU_API_KEY" > ~/.netrc
                  echo "machine api.heroku.com" >> ~/.netrc
                  echo "  login $HEROKU_API_KEY" >> ~/.netrc
                  echo "  password x" >> ~/.netrc
                  echo "machine git.heroku.com" >> ~/.netrc
                  echo "  login $HEROKU_API_KEY" >> ~/.netrc
                  echo "  password x" >> ~/.netrc
                  chmod 600 ~/.netrc

            - name: Add Heroku remote
              run: |
                  git remote add heroku https://git.heroku.com/reservation-api-dev.git || git remote set-url heroku https://git.heroku.com/reservation-api-dev.git

            - name: Deploy to Heroku
              run: |
                  # Push to Heroku main branch (same command we used manually)
                  git push heroku HEAD:main --force
